# Install Snakemake Environment
# ---------------------------
# To create snakemake env:
#   conda env create -f snakemake_install.yml -n snakemake
#
# To update the snakemake after adding new packages:
#   conda env update -f snakemake_install.yml -n snakemake

name: snakemake
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core language & Snakemake execution
  - python=3.12
  - snakemake
  - pyyaml
  
  # Data structures & Bioinformatics core
  - pandas
  - biopython
  - scipy
  - h5py
  
  # Interactive single-cell inspection & visualization
  - scanpy
  - anndata
  - matplotlib
  - seaborn

  # ipynb related package
  - ipykernel
  # register ipynb kernel based on current env: 
  # python -m ipykernel install --user --name snakemake --display-name "Python (snakemake)"

  
# this is a snakemake portable env setup for newly installed 
